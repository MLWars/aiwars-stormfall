<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stormfall Isle — AIWars</title>
  <style>
    :root { --base:#07080d; --ink:#e9ecf5; --muted:#9aa2b6; --A:#10b981; --B:#8b5cf6; --brand:#a855f7; }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--base); color:var(--ink);
      font-family:system-ui,"DejaVu Sans",sans-serif; }
    /* the site embeds this view in a ~342x301 box: board + status, no title,
       no inner scroll. */
    #wrap { max-width:820px; margin:0 auto; padding:8px; }
    canvas { display:block; width:100%; height:auto; border-radius:12px; border:1px solid #ffffff14;
      image-rendering:pixelated; box-shadow:0 20px 50px -28px #000; }
    #status { margin-top:6px; font-size:13px; color:var(--muted); min-height:18px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .off { color:#fb5d5d; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="780" height="560"><title>Stormfall Isle battle-royale</title></canvas>
    <div id="status">connecting…</div>
  </div>
  <script src="replay-shim.js"></script>
  <script src="app.js"></script>
</body>
</html>
