<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>LINE WARS — math is a weapon</title>
    <style>
      :root {
        color-scheme: dark;
        --gold: #ffd23f;
        --bg0: #0a0b11;
        --bg1: #14162199;
        --ink: #eef1f8;
        --dim: #8b93a7;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background:
          radial-gradient(1200px 700px at 50% -10%, #1b2030 0%, transparent 60%),
          radial-gradient(900px 600px at 50% 120%, #1a1230 0%, transparent 55%),
          var(--bg0);
        color: var(--ink);
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { height: 100%; display: flex; flex-direction: column; padding: 8px 12px; gap: 7px; }

      /* ---- title ---- */
      .title { text-align: center; line-height: 1; flex: 0 0 auto; }
      .title h1 {
        margin: 0; font-family: "Impact", "Haettenschweiler", "Arial Black", sans-serif;
        font-size: clamp(20px, 4.6vw, 38px); letter-spacing: 2px; font-weight: 900;
        background: linear-gradient(90deg, #38e1ff, #fff 50%, #ff5db1);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 2px 18px rgba(255,255,255,.08); transform: skewX(-6deg);
      }
      .title .sub { margin-top: 1px; font-size: 10.5px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }

      /* ---- leaderboard (N players) ---- */
      .board { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center;
        max-height: 22vh; overflow: auto; padding: 1px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
        background: var(--bg1); border: 1px solid #ffffff14; font-size: 12.5px; font-weight: 700;
        white-space: nowrap; transition: transform .15s, border-color .15s; }
      .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 8px currentColor; }
      .chip .nm { max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
      .chip .ct { font-family: ui-monospace, monospace; color: var(--dim); font-weight: 800; }
      .chip.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 6px 22px #ffd23f22; transform: translateY(-1px); }
      .chip.active .ct { color: var(--gold); }
      .chip.out { opacity: .4; }
      .chip.out .nm { text-decoration: line-through; }

      /* ---- battlefield ---- */
      .arena { flex: 1 1 auto; min-height: 0; position: relative; border-radius: 14px; overflow: hidden;
        border: 1px solid #ffffff14; box-shadow: inset 0 0 80px #0008, 0 18px 50px #0007; }
      #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* ---- bottom status / chalkboard ---- */
      .bottom { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: 30px; }
      .chalk { flex: 1 1 auto; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 13px; padding: 6px 12px; border-radius: 10px; background: #0c1410;
        border: 1px solid #1f3a2a; color: #b8f5cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        box-shadow: inset 0 0 22px #00351a55; }
      .chalk b { color: #eafff2; }
      .meme { flex: 0 0 auto; font-family: "Impact", "Arial Black", sans-serif; letter-spacing: 1px;
        font-size: 16px; color: var(--ink); text-transform: uppercase; }
      .badge { flex: 0 0 auto; padding: 4px 10px; border-radius: 999px; background: #1a1b22;
        border: 1px solid #2a2c36; font-weight: 800; font-size: 12px; }
      #status { text-align: center; color: var(--dim); font-size: 12px; flex: 0 0 auto; min-height: 14px; }
      .off { color: #f2a0a0; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="title">
        <h1>LINE&nbsp;WARS</h1>
        <div class="sub">the curve is the bullet · free-for-all</div>
      </div>
      <div class="board" id="board"></div>
      <div class="arena"><canvas id="field"></canvas></div>
      <div class="bottom">
        <span class="badge" id="ply">ply 0</span>
        <div class="chalk" id="chalk">f(x) = <b>—</b></div>
        <span class="meme" id="meme"></span>
      </div>
      <div id="status">connecting…</div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
