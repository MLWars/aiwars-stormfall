<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>AIWars — nim</title>
    <!--
      Nim: one pile of stones, two players, take 1-3, last stone wins. A vertical stack
      (opponent → pile → hero → status) so it never overflows a phone: the pile of pebbles
      wraps within its own frame and shrinks as stones are taken. Self-contained on purpose —
      no external assets: this file also ships inside the game pod. Presentation only; all data
      plumbing lives in app.js.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden;
        background: #0f1014; color: #e7e7ea;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased; }
      /* A phone-width content column pinned to the left origin. Capping the width here (rather
         than centering it in the viewport) keeps the whole UI inside the leftmost 390px REGARDLESS
         of how wide the layout viewport actually is: some headless screenshot harnesses inflate
         the CSS viewport (e.g. --window-size=390 yields a 500px innerWidth) and then crop to 390,
         which would clip a viewport-centred layout. A left-origin, max-width column can't be
         cropped, and on a real 390px phone it is simply full-width. */
      #app { height: 100%; width: 100%; max-width: 390px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; padding: 12px; }

      /* meta row (stones left) */
      .meta { display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
        font-size: 12.5px; color: #9aa0aa; }
      .badge { padding: 3px 12px; border-radius: 999px; background: #1a1b22;
        border: 1px solid #2a2c36; font-weight: 800; color: #e7e7ea;
        font-variant-numeric: tabular-nums; }

      /* a player plate: name + a "to move" cue */
      .seat { display: flex; align-items: center; justify-content: center; gap: 8px;
        flex: 0 0 auto; width: 100%; }
      .who { display: inline-flex; align-items: center; gap: 8px; font-weight: 700;
        background: #0b0c10cc; border: 1px solid #ffffff1a; border-radius: 999px;
        padding: 6px 14px; max-width: 92%; }
      .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .seat.turn .who { box-shadow: 0 0 0 2px #7ee787, 0 0 14px #7ee78766; }
      .seat.turn .who::after { content: "to move"; font-size: 10px; letter-spacing: 1px;
        color: #7ee787; font-weight: 800; text-transform: uppercase; }
      .seat.win .who { box-shadow: 0 0 0 2px #ffd76a, 0 0 16px #ffd76a66; }

      /* the pile — a wrapping bed of pebbles, the largest that fits the free space */
      .pilewrap { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex;
        align-items: center; justify-content: center; }
      #pile { display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
        gap: clamp(5px, 2.2vw, 12px); width: 100%; max-width: 100%; max-height: 100%;
        overflow: auto; padding: 14px; border-radius: 22px;
        background: radial-gradient(ellipse at center, #1a1c24 0%, #131419 70%, #0e0f14 100%);
        border: 1px solid #262833; box-shadow: inset 0 0 30px #0007; }
      /* a stone: a rounded pebble; enters with a pop, leaves by scaling away */
      .stone { width: clamp(18px, 7vw, 30px); aspect-ratio: 1;
        border-radius: 46% 54% 52% 48% / 50% 48% 52% 50%;
        background: radial-gradient(circle at 34% 30%, #cfd3db 0%, #969ba6 45%, #5c616c 100%);
        box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 -2px 4px #0006, inset 0 2px 3px #ffffff30;
        transition: transform .24s ease, opacity .24s ease; }
      .stone.pop { animation: pop .24s ease; }
      .stone.gone { transform: scale(0) translateY(-8px) rotate(18deg); opacity: 0; }
      @keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* status / move log line */
      #status { text-align: center; color: #9aa0aa; min-height: 16px; font-size: 12.5px;
        flex: 0 0 auto; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
      #status b { color: #e7e7ea; }
      .win { color: #ffd76a; font-weight: 700; }
      .off { color: #f2a0a0; }
      .you { color: #7ee787; font-weight: 700; }
      .sent { color: #cdd3dd; font-style: italic; }

      /* seat-mode action bar (epic #317): the three TAKE buttons for the seat's legal moves */
      #actions { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; flex: 0 0 auto; }
      #actions.on { display: flex; }
      #actions button { background: #1a1b22; color: #e7e7ea; border: 1px solid #3a6b52;
        border-radius: 9px; font: inherit; font-weight: 800; padding: 10px 18px; cursor: pointer;
        min-height: 44px; min-width: 44px; }
      #actions button:hover { background: #23252c; border-color: #7ee787; }

      /* endgame banner — sits over the pile, still visible under it */
      #fin { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; pointer-events: none;
        background: radial-gradient(ellipse at center, #1a160bdd, #1a160b88); border-radius: inherit; }
      #fin.on { display: flex; }
      #fin .big { font-size: 26px; font-weight: 800; color: #ffd76a; text-shadow: 0 2px 16px #000a; }
      #fin .sub { margin-top: 6px; color: #e7e7ea; font-size: 14px; padding: 0 12px; }

      /* replay transport (?replay) — hidden in live mode; app.js reveals it */
      #controls { display: none; align-items: center; justify-content: center; flex-wrap: wrap;
        gap: 7px; flex: 0 0 auto; }
      #controls button, #controls select {
        background: #1a1b22; color: #e7e7ea; border: 1px solid #2a2c36; border-radius: 6px;
        font: inherit; font-weight: 700; padding: 2px 9px; cursor: pointer; }
      #controls button:hover { background: #23252c; }
      #seek { width: 130px; accent-color: #7ee787; }
      #pos { font: 700 12px/1 ui-monospace, monospace; color: #9aa0aa; min-width: 44px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="meta">
        <span class="badge" id="stones">— stones</span>
      </div>
      <div class="seat" id="seat-top"><div class="who"><span class="nm">—</span></div></div>
      <div class="pilewrap">
        <div id="pile" aria-label="the pile"></div>
        <div id="fin"><div class="big"></div><div class="sub"></div></div>
      </div>
      <div class="seat" id="seat-bot"><div class="who"><span class="nm">—</span></div></div>
      <div id="controls">
        <button id="first" title="First">⏮</button>
        <button id="prev" title="Previous">◀</button>
        <button id="play" title="Play/pause">▶</button>
        <button id="next" title="Next">▶▏</button>
        <button id="last" title="Final">⏭</button>
        <input id="seek" type="range" min="0" max="0" value="0" />
        <span id="pos">–/–</span>
        <select id="speed" title="Playback speed">
          <option value="2400">0.5×</option>
          <option value="1200" selected>1×</option>
          <option value="600">2×</option>
          <option value="300">4×</option>
        </select>
      </div>
      <div id="actions" aria-label="your move"></div>
      <div id="status">connecting…</div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
