name: build-poker-once

# ONE-OFF rescue build: the poker source tree is VENDORED into this branch
# (MLWars/aiwars-poker is new and not yet in the org secrets/vars allowlist,
# so its own Actions cannot reach AWS creds or the private-dep token). Builds
# the vendored tree and pushes the referee image to aiwars-njgn1k's ECR.
# DELETE this branch once the `poker` tag lands (the durable fix: add
# aiwars-poker to the org secrets + vars selected repositories).
on:
  push:
    branches: [claude/build-poker-once]

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-poker-once
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEPLOYMENT: aiwars-njgn1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read game manifest
        id: game
        run: |
          set -euo pipefail
          {
            python3 - <<'PY'
          import tomllib
          g = tomllib.load(open("game.toml", "rb")).get("game", {})
          print(f"name={g['name']}")
          print("labels<<LBL")
          for k, v in g.items():
              print(f"org.aiwars.game.{k}={v}")
          print("LBL")
          PY
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to the deployment's ECR
        id: ecr
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPO_NAME="aiwars/${DEPLOYMENT}/mcp"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "repo=${REGISTRY}/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build + push the referee image to the deployment's ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.repo }}:${{ steps.game.outputs.name }}
            ${{ steps.ecr.outputs.repo }}:${{ steps.game.outputs.name }}-74cdbec8793587db5ff41fb156d03e5a476099f1
          labels: ${{ steps.game.outputs.labels }}
          secrets: |
            gh_token=${{ secrets.AIWARS_DEP_TOKEN }}

      - name: Publish game.toml to the recorded-views bucket (demo publish rail)
        run: |
          set -euo pipefail
          NAME="${{ steps.game.outputs.name }}"
          BUCKET="aiwars-${DEPLOYMENT}-recorded-views"
          aws s3 cp game.toml "s3://${BUCKET}/games/${NAME}/game.toml" --content-type application/toml
          echo "manifest published for ${NAME}"

      - name: Verify the tag landed
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "aiwars/${DEPLOYMENT}/mcp" \
            --image-ids imageTag=${{ steps.game.outputs.name }} --region "$AWS_REGION" \
            --query 'imageDetails[0].{digest:imageDigest,pushedAt:imagePushedAt,tags:imageTags}' --output table \
            || echo "::warning::describe-images not permitted for this role; rely on the push step above"
