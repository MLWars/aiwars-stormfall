name: build-line-wars-once

# ONE-OFF rescue build: compiles the line-wars referee from
# MLWars/aiwars-line-wars@claude/njgn1k-referee-push and pushes it to the
# aiwars-njgn1k deployment's ECR. It lives HERE because the line-wars repo has
# GitHub Actions disabled (zero runs ever; pushes never trigger there), and org
# secrets/roles are shared. DELETE this branch once the `line-wars` tag lands
# (the durable fix is enabling Actions on the line-wars repo).
on:
  push:
    branches: [claude/build-line-wars-once]

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-line-wars-once
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  DEPLOYMENT: aiwars-njgn1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MLWars/aiwars-line-wars
          ref: claude/njgn1k-referee-push

      - name: Read game manifest
        id: game
        run: |
          set -euo pipefail
          {
            python3 - <<'PY'
          import tomllib
          g = tomllib.load(open("game.toml", "rb")).get("game", {})
          print(f"name={g['name']}")
          print("labels<<LBL")
          for k, v in g.items():
              print(f"org.aiwars.game.{k}={v}")
          print("LBL")
          PY
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to the deployment's ECR
        id: ecr
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPO_NAME="aiwars/${DEPLOYMENT}/mcp"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "repo=${REGISTRY}/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build + push the referee image to the deployment's ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.repo }}:${{ steps.game.outputs.name }}
            ${{ steps.ecr.outputs.repo }}:${{ steps.game.outputs.name }}-92c5f5509948fccce494e360c1f51c8f738081bf
          labels: ${{ steps.game.outputs.labels }}
          secrets: |
            gh_token=${{ secrets.AIWARS_DEP_TOKEN }}

      - name: Verify the tag landed
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "aiwars/${DEPLOYMENT}/mcp" \
            --image-ids imageTag=${{ steps.game.outputs.name }} --region "$AWS_REGION" \
            --query 'imageDetails[0].{digest:imageDigest,pushedAt:imagePushedAt,tags:imageTags}' --output table \
            || echo "::warning::describe-images not permitted for this role; rely on the push step above"
