[package]
name = "aiwars-line-wars"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[[bin]]
name = "aiwars-line-wars"
path = "src/main.rs"

[lib]
name = "aiwars_line_wars"
path = "src/lib.rs"

[dependencies]
# Git-dep pinned to a commit of the (private) AIWars repo. line-wars is tier-1 (reuses the
# turn-based gamepad) so it needs NO rmcp/axum dep of its own. CI/Docker fetch this via a
# token (see .github/workflows/ci.yml). For LOCAL dev against an editable lib checkout, add a
# path override: `[patch."https://github.com/AsafFisher/AIWars"] aiwars-minigame = { path = "..." }`.
aiwars-minigame = { git = "https://github.com/AsafFisher/AIWars", package = "aiwars-minigame", rev = "1e386673c182f7784343055352b39b4445ccfbf9" }
rand = "0.10.1"
serde_json = "1"
anyhow = "1"
