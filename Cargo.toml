[package]
name = "aiwars-nim"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[[bin]]
name = "aiwars-nim"
path = "src/main.rs"

[lib]
name = "aiwars_nim"
path = "src/lib.rs"

[dependencies]
# Git-dep pinned to a commit of the (private) AIWars repo. nim is tier-1 (reuses the
# turn-based gamepad) so it needs NO rmcp/axum dep of its own. Cargo.lock is committed;
# rmcp-macros is pinned to 1.7.0 to match rmcp. Same set as poker/chess minus their
# game-specific extras — nim hand-rolls its (tiny) rules and needs NO rand: it is fully
# deterministic (one pile, take 1-3, no shuffle, no dice).
aiwars-minigame = { git = "https://github.com/AsafFisher/AIWars", package = "aiwars-minigame", rev = "af88d7c" }
serde_json = "1"
anyhow = "1"
